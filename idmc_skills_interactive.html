<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IDMC Skills: Interactive Showcase</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: #ffffff;
            color: #1a1a2e;
            line-height: 1.6;
        }

        .header {
            background: linear-gradient(135deg, #0176D3 0%, #014486 100%);
            color: white;
            padding: 60px 40px;
            text-align: center;
        }

        .header h1 {
            font-size: 48px;
            font-weight: 300;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 18px;
            opacity: 0.9;
        }

        .container {
            max-width: 1800px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 24px;
            margin-top: 40px;
        }

        .skill-tile {
            background: white;
            border: 2px solid #E5E9EF;
            border-radius: 12px;
            padding: 24px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .skill-tile:hover {
            border-color: #0176D3;
            box-shadow: 0 8px 24px rgba(1, 118, 211, 0.15);
            transform: translateY(-2px);
        }

        .skill-tile.expanded {
            grid-column: span 2;
            border-color: #0176D3;
            box-shadow: 0 12px 32px rgba(1, 118, 211, 0.2);
        }

        .skill-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .skill-number {
            font-size: 14px;
            color: #0176D3;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .skill-title {
            font-size: 20px;
            font-weight: bold;
            color: #1a1a2e;
            margin-bottom: 8px;
        }

        .skill-type {
            display: inline-block;
            background: #0176D3;
            color: white;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .skill-type.mcp {
            background: #3EB1C8;
        }

        .skill-status {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
            margin-top: 8px;
        }

        .skill-status.exists {
            background: #D1FAE5;
            color: #065F46;
        }

        .skill-status.planned {
            background: #DBEAFE;
            color: #1E40AF;
        }

        .skill-status.partial {
            background: #FEF3C7;
            color: #92400E;
        }

        .skill-status.new {
            background: #E0E7FF;
            color: #3730A3;
        }

        .skill-description {
            font-size: 14px;
            color: #6B7280;
            margin-bottom: 16px;
        }

        .skill-details {
            display: none;
            margin-top: 24px;
            padding-top: 24px;
            border-top: 2px solid #E5E9EF;
        }

        .skill-tile.expanded .skill-details {
            display: block;
        }

        .example-section {
            margin-bottom: 20px;
        }

        .prompt-box {
            background: #F7F9FC;
            border-left: 4px solid #0176D3;
            padding: 16px;
            border-radius: 4px;
            margin-bottom: 16px;
        }

        .prompt-label {
            font-size: 11px;
            font-weight: bold;
            color: #0176D3;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .prompt-text {
            font-size: 16px;
            color: #1a1a2e;
            font-style: italic;
        }

        .output-box {
            background: #ffffff;
            border: 2px solid #E5E9EF;
            border-radius: 8px;
            padding: 20px;
        }

        .output-label {
            font-size: 11px;
            font-weight: bold;
            color: #0176D3;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }

        .output-content {
            font-size: 14px;
            color: #374151;
            line-height: 1.7;
        }

        .output-content strong {
            color: #0176D3;
            display: block;
            margin-top: 12px;
            margin-bottom: 4px;
        }

        .output-content ul {
            margin: 8px 0 8px 20px;
        }

        .output-content li {
            margin: 4px 0;
        }

        .prototype-link {
            display: inline-block;
            background: #0176D3;
            color: white;
            padding: 12px 24px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            margin-top: 16px;
            transition: all 0.2s ease;
        }

        .prototype-link:hover {
            background: #014486;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(1, 118, 211, 0.3);
        }

        .api-list {
            font-size: 12px;
            color: #6B7280;
            margin-top: 16px;
            padding: 12px;
            background: #F7F9FC;
            border-radius: 4px;
        }

        .api-list strong {
            color: #0176D3;
        }

        .click-hint {
            font-size: 12px;
            color: #0176D3;
            text-align: center;
            margin-top: 12px;
            opacity: 0.7;
        }

        .legend {
            display: flex;
            gap: 24px;
            justify-content: center;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }
    </style>
</head>

                prototype: null
            },
            {
                number: 20,
                title: "Modernize legacy pipelines",
                type: "MCP",
                status: "new",
                description: "Analyze PowerCenter → recommend CDI patterns",
                prompt: "Migrate 50 PowerCenter workflows to modern CDI",
                output: `<strong>Migration Analysis:</strong>

<strong>Legacy Workflows:</strong> 50 PowerCenter mappings

<strong>Complexity Assessment:</strong>
• Simple (direct mapping): 25 workflows → 2 days
• Medium (transformations): 18 workflows → 8 days
• Complex (custom logic): 7 workflows → 15 days

<strong>Modernization Opportunities:</strong>
• 30 can use pushdown → 3x faster
• 15 can use CDC instead of full load → 90% less data
• 12 have redundant transformations → consolidate

<strong>Generated Migration Plan:</strong>
1. Start with 25 simple workflows (quick wins)
2. Migrate medium complexity next
3. Complex workflows need custom review

<strong>Estimated Effort:</strong> 25 days total
<strong>Expected Benefit:</strong> 60% faster runtime, 50% lower IPU costs`,
                apis: "Mapping Generation (read legacy), Taskflow Lifecycle",
                prototype: null
            }
        ];

        const skillsGrid = document.getElementById('skillsGrid');

        skills.forEach(skill => {
            const tile = document.createElement('div');
            tile.className = 'skill-tile';
            tile.innerHTML = `
                <div class="skill-number">#${skill.number}</div>
                <div class="skill-header">
                    <div>
                        <div class="skill-title">${skill.title}</div>
                        <div>
                            <span class="skill-type ${skill.type === 'MCP' ? 'mcp' : ''}">${skill.type}</span>
                            <span class="skill-status ${skill.status}">${skill.status.toUpperCase()}</span>
                        </div>
                    </div>
                </div>
                <div class="skill-description">${skill.description}</div>
                <div class="click-hint">👆 Click to see example</div>

                <div class="skill-details">
                    <div class="prompt-box">
                        <div class="prompt-label">Example Prompt</div>
                        <div class="prompt-text">"${skill.prompt}"</div>
                    </div>

                    <div class="output-box">
                        <div class="output-label">Output</div>
                        <div class="output-content">${skill.output}</div>
                    </div>

                    <div class="api-list">
                        <strong>APIs Used:</strong> ${skill.apis}
                    </div>

                    ${skill.prototype ? `
                        <a href="${skill.prototype}" target="_blank" class="prototype-link">
                            🚀 View Interactive Prototype
                        </a>
                    ` : ''}
                </div>
            `;

            tile.addEventListener('click', () => {
                const wasExpanded = tile.classList.contains('expanded');

                // Collapse all tiles
                document.querySelectorAll('.skill-tile').forEach(t => {
                    t.classList.remove('expanded');
                });

                // Expand clicked tile if it wasn't expanded
                if (!wasExpanded) {
                    tile.classList.add('expanded');
                    tile.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }
            });

            skillsGrid.appendChild(tile);
        });
    </script>
</body>
</html>
